# Throwaway trial: convenience binaries of the compiler, built from the
# source tarball, for every platform with a GitHub-hosted runner.
name: "Compiler binaries (trial)"

on:
  push:
    branches: ["arm64-ci-trial-binaries*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.dist.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo cp .github/apt/99-ci-network /etc/apt/apt.conf.d/
      - run: |
          sudo apt-get update -yq
          sudo apt-get install -y --no-install-recommends automake bison flex g++ libtool make pkg-config
      - run: ./bootstrap.sh
      - run: ./configure --disable-debug --disable-tests --disable-libs
      - id: dist
        run: |
          make dist
          tarball=$(ls thrift-*.tar.gz)
          version=${tarball#thrift-}; version=${version%.tar.gz}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sha512sum "$tarball"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: thrift-*.tar.gz
          retention-days: 3

  unix:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 sets the glibc floor at 2.35.
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
          - platform: macos-universal
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.source.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
      - name: Unpack the source release
        run: tar xzf thrift-$VERSION.tar.gz
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -yq
          sudo apt-get install -y --no-install-recommends bison cmake flex g++ make
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Configure
        working-directory: thrift-${{ needs.source.outputs.version }}
        run: |
          args=(-DBUILD_LIBRARIES=OFF -DBUILD_TESTING=OFF -DBUILD_TUTORIALS=OFF -DCMAKE_BUILD_TYPE=Release)
          if [ "$RUNNER_OS" = Linux ]; then
            args+=("-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc")
          else
            args+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          fi
          cmake -S . -B build "${args[@]}"
      - name: Build
        run: cmake --build thrift-$VERSION/build -j4
      - name: Package
        run: |
          pkg=thrift-$VERSION-$PLATFORM
          mkdir -p $pkg/bin
          cp thrift-$VERSION/build/compiler/cpp/bin/thrift $pkg/bin/
          strip $pkg/bin/thrift
          cp thrift-$VERSION/LICENSE thrift-$VERSION/NOTICE $pkg/
          tar czf $pkg.tar.gz $pkg
          shasum -a 512 $pkg.tar.gz > $pkg.tar.gz.sha512
          cat $pkg.tar.gz.sha512
      - name: Inspect the binary
        run: |
          bin=thrift-$VERSION-$PLATFORM/bin/thrift
          file $bin
          if [ "$RUNNER_OS" = Linux ]; then
            readelf -d $bin | grep NEEDED
            ! readelf -d $bin | grep -E 'libstdc\+\+|libgcc_s'
            echo "newest glibc symbol: $(objdump -T $bin | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          else
            lipo -archs $bin
            lipo -archs $bin | grep -q arm64 && lipo -archs $bin | grep -q x86_64
            otool -L $bin
            otool -l $bin | grep -A3 LC_BUILD_VERSION | grep minos
          fi
      - name: Smoke test
        run: |
          bin=$PWD/thrift-$VERSION-$PLATFORM/bin/thrift
          $bin -version
          mkdir out
          $bin -r --gen cpp --gen java --gen py --gen go --gen rs -out out thrift-$VERSION/test/ThriftTest.thrift
          find out -type f | wc -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thrift-${{ needs.source.outputs.version }}-${{ matrix.platform }}
          path: thrift-${{ needs.source.outputs.version }}-${{ matrix.platform }}.tar.gz*
          retention-days: 3

  windows:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            machine: '8664'
          - platform: windows-arm64
            runner: windows-11-arm
            machine: 'AA64'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.source.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
      - name: Unpack the source release
        shell: bash
        run: tar xzf thrift-$VERSION.tar.gz
      - name: Install winflexbison
        shell: pwsh
        run: choco install winflexbison3 --version=2.5.24.20210105 -y --no-progress
      - name: Configure
        shell: pwsh
        run: cmake -S thrift-$env:VERSION -B build -DBUILD_LIBRARIES=OFF -DBUILD_TESTING=OFF -DBUILD_TUTORIALS=OFF
      - name: Build
        run: cmake --build build --config Release
      - name: Install
        run: cmake --install build --config Release --prefix install
      - name: Check what the compiler imports
        shell: pwsh
        run: ./thrift-$env:VERSION/build/windows/check-compiler-imports.ps1 -Path install/bin/thrift.exe
      - name: Check the machine type
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("install/bin/thrift.exe")
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = '{0:X4}' -f [BitConverter]::ToUInt16($bytes, $pe + 4)
          Write-Host "PE machine: $machine"
          if ($machine -ne '${{ matrix.machine }}') { exit 1 }
      - name: Smoke test
        shell: pwsh
        run: |
          ./install/bin/thrift.exe -version
          New-Item -ItemType Directory out | Out-Null
          ./install/bin/thrift.exe -r --gen cpp --gen java --gen py --gen netstd -out out thrift-$env:VERSION/test/ThriftTest.thrift
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-ChildItem -Recurse -File out).Count
      - name: Package
        shell: pwsh
        run: |
          $pkg = "thrift-$env:VERSION-$env:PLATFORM"
          New-Item -ItemType Directory "$pkg/bin" | Out-Null
          Copy-Item install/bin/thrift.exe "$pkg/bin/"
          Copy-Item "thrift-$env:VERSION/LICENSE", "thrift-$env:VERSION/NOTICE" $pkg
          Compress-Archive -Path $pkg -DestinationPath "$pkg.zip"
          $hash = (Get-FileHash -Algorithm SHA512 "$pkg.zip").Hash.ToLower()
          "$hash  $pkg.zip" | Set-Content "$pkg.zip.sha512"
          Get-Content "$pkg.zip.sha512"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thrift-${{ needs.source.outputs.version }}-${{ matrix.platform }}
          path: thrift-${{ needs.source.outputs.version }}-${{ matrix.platform }}.zip*
          retention-days: 3
